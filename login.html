<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Ford Login Page</title>
</head>

<body>
    <div class="login">

        <div class="seçãoEsquerda">
            <img class="imgLogin" src="img/ranger.png" alt="Ford Ranger">
        </div>

        <div class="seçãoDireita">
            <div class="formLogin">
                <img class="imgLogo" src="img/ford.png" alt="Logo da Ford">

                <h2>Bem-vindo(a)!</h2>

                <form id="loginForm" novalidate>
                    <div class="campo">
                        <label for="usuario">Usuário:</label>
                        <input type="text" id="usuario" placeholder="Digite o usuário." required>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" placeholder="Digite a senha." required>
                    </div>

                    <div class="campoCheckbox">
                        <input type="checkbox" id="boxLogin">
                        <label for="boxLogin">Logar automaticamente</label>
                    </div>

                    <button type="submit" class="botaoLogin">Entrar</button>

                    <p id="loginMensagem" aria-live="polite"></p>
                </form>
            </div>
        </div>
    </div>

    <script src="login.js" defer></script>
</body>
</html>
